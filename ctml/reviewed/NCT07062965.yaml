status: open to accrual
summary: 'The purpose of this study is to learn about the safety and effects of the
  study medicine PF-07248144 when given along with fulvestrant for the possible treatment
  of HR-positive, HER2-negative advanced or metastatic breast cancer.


  HR-positive breast cancer cells have proteins on their surface called receptors
  that bind to hormones like estrogen and progesterone (female sex hormones). These
  hormones can promote the growth of cancer cells.


  HER2-negative describes cells that have a small amount or none of a protein called
  HER2 on their surface. In normal cells, HER2 helps control cell growth. Cancer cells
  that are HER2-negative may grow more slowly and are less likely to recur (come back)
  or spread to other parts of the body than cancer cells that have a large amount
  of HER2 on their surface.


  Advanced cancer is a term that is often used to describe cancer that is unlikely
  to be cured.


  Metastatic cancer is the type where the cancer cells spread from one part of the
  body to another.


  This study is seeking for participants whose breast cancer has gotten worsen after
  receiving cyclin dependent kinase (CDK) 4/6 inhibitor-based therapy.


  Half of participants in this study will receive their usual study treatment, everolimus
  with endocrine therapy (either exemestane or fulvestrant) for HR-positive/HER2-negative
  advanced or metastatic breast cancer (A/mBC). The study doctor will discuss which
  hormone therapy is right for the participant before treatment begins.


  PF-07248144 is a tablet that will be taken by mouth at home every day in a 28-day
  cycle. Fulvestrant will be given as two injections (one injection in the buttock)
  at visits to the study clinic. Everolimus and exemestane are also tablets and will
  be taken by mouth at home every day in a 28-day cycle.


  The study will compare the experiences of people receiving PF-07248144 in combination
  with fulvestrant to those of the people who do not. This will help see if PF-07248144
  in combination with fulvestrant is safe and effective.'
