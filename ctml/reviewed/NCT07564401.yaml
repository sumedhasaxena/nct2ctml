summary: This is a Phase I/II, open-label, non-randomized, multi-center study in patients
  with extensive-stage small cell lung cancer (ES-SCLC) to determine the recommended
  dose(s) (RD) and to evaluate the safety, tolerability and preliminary efficacy of
  DJI136.
