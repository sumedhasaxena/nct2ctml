prior_treatment_requirements:
- 'Inclusion Criteria:'
- "1. Age \u226518 years"
- 2. High-grade serous ovarian, fallopian tube or primary peritoneal cancer
- 3. Tumor testing (archival acceptable) confirms a positive Cyclin E1 protein status
  result determined by IHC using the Sponsor's investigational clinical trial assay
- '4. Prior therapy:'
- 1. Subjects must have platinum-resistant disease
- 2. One to 3 prior lines or regimens are allowed (1 to 4 prior lines are permitted,
  if prior mirvetuximab)
- 3. Prior bevacizumab treatment is required, if eligible per standard of care
- 4. Prior PARP inhibitor treatment is required if BRCA 1/2 mutation or HRD, if eligible
  per standard of care
- 5. Prior mirvetuximab treatment is required, if eligible per standard of care
- 5. Measurable disease per RECIST Version 1.1.
- 6. Adequate hematologic and organ function, as defined in protocol
- 7. ECOG 0-1
- 'Exclude - Exclusion Criteria:'
- Exclude - 1. Primary platinum-refractory disease
- 'Exclude - 2. Any of the following treatment interventions within the specified
  time frame prior to C1D1:'
- Exclude - 1. Major surgery within 28 days
- Exclude - 2. Hospitalization within 14 days
- Exclude - 3. Any chemotherapy or targeted tumor therapy within 21 days or 5 half-lives
  (whichever is shorter);
- Exclude - 4. Radiation therapy within 21 days;
- Exclude - 5. Autologous or allogeneic stem cell transplant within 3 months.
- Exclude - 6. Current use of any other investigational drug therapy \<28 days or
  5 half-lives (whichever is shorter).
- Exclude - 7. Inability to discontinue treatment prescription or non-prescription
  drugs, or to discontinue consumption of food and herbal supplements that are strong
  or moderate CYP3A inhibitors and inducers or P-gp inhibitors at least 14 days prior
  to C1D1.
- Exclude - 3. Prior therapy with ZN-c3 or any other WEE1 inhibitor, ATR inhibitor,
  PKMYT1 inhibitor, or CHK1/2 inhibitor.
- 'Exclude - 4. A serious illness or medical condition(s) including, but not limited
  to:'
- Exclude - 1. Clinically or radiographically unstable brain metastases or leptomeningeal
  disease that requires immediate treatment. Subjects with asymptomatic brain metastases
  are eligible.
- Exclude - 2. Myocardial impairment resulting in heart failure (NYHA Class II-IV)
- Exclude - 3. Severe acute or chronic medical or psychiatric condition or laboratory
  abnormality that may increase risk associated with study participation or may interfere
  with interpretation of study results
- Exclude - 4. Acute kidney injury requiring intervention or intravenous fluid in
  the last 14 days or presence of indwelling urinary catheter or percutaneous nephrostomy.
- Exclude - 5. Significant gastrointestinal abnormalities, including an inability
  to take oral medication, requirement for intravenous alimentation, active peptic
  ulcer, chronic diarrhea or vomiting considered to be clinically significant in the
  judgment of the Investigator, or prior surgical procedures affecting absorption.
- Exclude - 6. Active, uncontrolled infection. Subjects with an infection receiving
  treatment (antibiotic, antifungal, or antiviral) must have completed such treatment
  and the infection must be considered controlled/resolved (and afebrile) by the Investigator
  for at least 7 days before C1D1
- Exclude - 7. Any evidence of bowel obstruction as determined by air/fluid levels
  on computed tomography (CT scan, recent hospitalization for small bowel obstruction
  within 3 months prior to C1D1, or recurrent paracentesis or thoracentesis within
  6 weeks prior to C1D1.
- "Exclude - 5. Unresolved toxicity of Grade \\>1 attributed to any prior therapies\
  \ (excluding Grade \u22642 neuropathy, alopecia, or skin pigmentation)."
- Exclude - 6. Pregnant or lactating female subject or female subject of childbearing
  potential who has a positive serum pregnancy test within 14 days prior to C1D1.
- Exclude - 7. History of another malignancy in the previous 2 years, unless cured
  by surgery alone and continuously disease free. Exceptions include appropriately
  treated carcinoma in situ of the cervix, non-melanoma skin carcinoma, Stage 1 uterine
  cancer, or other malignancies with an expected curative outcome.
- Exclude - 8. Subjects who are known to be immunocompromised or HIV-positive on highly
  active anti-retroviral therapy.
- Exclude - 9. Subjects with known active hepatitis B or hepatitis C infection.
- Exclude - 10. Individuals who are judged by the Investigator to be unsuitable as
  study subjects.
- "Exclude - 11. Subjects who had prior wide-field radiotherapy affecting \u2265 20%\
  \ of the bone marrow."
