status: open to accrual
summary: This is a multi-part Phase 2 study to evaluate the efficacy and safety of
  azenosertib (ZN-c3) in subjects with Platinum-Resistant, High-Grade Serous Ovarian,
  Fallopian Tube, or Primary Peritoneal Cancer. Part 2 of the study will be conducted
  in subjects whose tumors are Cyclin E1 positive as determined by central review
  using the Sponsor's investigational clinical trial assay.
