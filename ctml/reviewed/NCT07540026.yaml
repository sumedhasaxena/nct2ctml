summary: 'Background Gastrointestinal bleeding is a common disease among the population
  in Taiwan, with gastrointestinal tumor bleeding accounting for 3-5% of cases. The
  pathophysiology of gastrointestinal tumor bleeding is unique, involving fragile
  surface mucosa, abnormal vascular proliferation, and malformation, making endoscopic
  hemostasis challenging. Conventional endoscopic hemostasis methods such as hemostatic
  injections, clips, or thermal coagulation have suboptimal success rates below 80%,
  with recurrence rates exceeding 50%. Recent clinical trials have demonstrated that
  hemostatic powder spraying effectively enhances hemostasis for gastrointestinal
  ulcers and reduces recurrence rates. Our previous research repurposed tranexamic
  acid in a powder form to enhance hemostasis for peptic ulcer and applied sucralfate
  powder to prevent postpolypectomy wound bleeding.


  Study aim Our research team combines previous experience by using tranexamic acid
  and sucralfate drug powders to spray onto bleeding gastrointestinal tumors to achieve
  hemostatic effects. Additionally, tumor-derived exosomes are associated with tumor
  angiogenesis and growth, so we hypothesize that gastrointestinal tumor bleeding
  may be linked to VEGF and miR-21 expression within gastrointestinal tumor exosomes.


  Study method This study is a clinical randomized controlled trial conducted at National
  Cheng Kung University Hospital. We will recruit 60 patients with gastrointestinal
  tumor bleeding undergoing endoscopic hemostasis. Patients in the experimental treatment
  group will receive additional topical administration of 1.5 g of tranexamic acid
  and 3 g of sucralfate drug powder. Immediate hemostasis and 30-day bleeding recurrence
  will be observed. Enrolled patients will also provide blood and tumor specimens
  for exosome analysis, evaluating the predictive effect of extracted tumor exosomes''
  VEGF and miR-21 on bleeding risk. This study will explore the association between
  specific tumor exosome expression levels and bleeding, serving as a basis for bleeding
  risk assessment and innovative therapies.'
