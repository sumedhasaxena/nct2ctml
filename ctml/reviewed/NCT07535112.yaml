prior_treatment_requirements:
- 'Inclusion Criteria:'
- '* KRAS G12D mutated solid tumor'
- "* Participant must be \u226518 years old or the legal age of consent in the jurisdiction\
  \ in which the study is taking place when signing the screening ICF"
- '* At least one measurable lesion as per RECIST v1.1. outside the CNS'
- "* Eastern Cooperative Oncology Group performance status (ECOG PS) of \u22641"
- '* Male or Female: Contraceptive use by participant or participant''s partners should
  be consistent with local regulations regarding the methods of contraception for
  those participating in clinical studies.'
- '* Life expectancy of at least 3 months in the opinion of the Investigator'
- '* Histologically/pathologically documented diagnosis of advanced/metastatic adenocarcinoma
  of the colon and rectum.'
- '* Adequate hematologic and end-organ function'
- 'Exclude - Exclusion Criteria:'
- Exclude - * Leptomeningeal disease or carcinomatous meningitis
- Exclude - * Uncontrolled and/or active/symptomatic brain metastases.
- Exclude - * Significant traumatic injury or major surgical procedure within 4 weeks
  of first dose of study intervention
- Exclude - * Known hypersensitivity to any component of study intervention
- Exclude - * Previous (within 3 years) or concurrent cancer that is distinct in primary
  site or histology from the cancer being evaluated in the respective substudy.
- Exclude - * Active infection requiring systemic anti-infective therapy within 14
  days of first dose of study intervention
- Exclude - * Known HIV infection
- Exclude - * Active Hepatitis B virus (HBV) infection
- Exclude - * Active Hepatitis C virus (HCV) infection;
- Exclude - * Significant cardiac disorder
- Exclude - * History of risk factors for torsade de pointes (TdP) (e.g., heart failure,
  family history of long QT syndrome)
- Exclude - * Participants with inadequately managed diabetes as assessed by the Investigator
- "Exclude - * Toxicities from prior anticancer therapy, defined as not having resolved\
  \ to Grade \u22641 or as specified in the respective substudy protocol as per NCI\
  \ CTCAE v.6.0 with the following exceptions: Alopecia of any grade, Peripheral neuropathy\
  \ Grade \u22642, Autoimmune endocrine disorders Grade \u22642 managed with stable\
  \ endocrine replacement therapy"
- Exclude - * History of (non-infectious) pneumonitis/interstitial lung disease (ILD),
  drug-induced ILD, radiation pneumonitis (unless it has resolved without sequelae
  without use of steroids), or any evidence of clinically-active pneumonitis/ILD
- 'Exclude - * History of the following eye disorders: keratitis, ulcerative keratitis'
