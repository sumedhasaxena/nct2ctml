prior_treatment_requirements:
- 'Inclusion Criteria:'
- '* Pathological stage II-IIIA (UICC/ AJCC staging 9th edition) NSCLC Brain imaging
  should have been performed to complete staging, either preoperatively or postoperatively.
  If brain imaging has not been performed, a contrast-enhanced CT or MRI of the brain
  must be performed at screening prior randomisation.'
- '* Complete resection with negative surgical margins (R0).'
- '* Acceptable types of surgical resection include any of the following:'
- '* Lobectomy, sleeve lobectomy, bilobectomy, or pneumectomy.'
- "* Segmentectomy for tumours \u22642 cm is permitted in patients with poor pulmonary\
  \ reserve or another major comorbidity that contraindicates lobectomy."
- '* Wedge resection is not allowed.'
- '* Lymph node dissection should be done according to applicable guidelines.'
- '* No disease recurrence following surgical resection.'
- "* Tumour PD-L1 expression of \u22651%, determined locally using a locally approved\
  \ immuno-histochemistry test."
- '* Availability of archival FFPE tumour tissue for central PD-L1 expression testing.'
- '* Patient is not considered for adjuvant platinum-based chemotherapy due to:'
- '* Documented patient refusal; or'
- '* Patient is unfit to receive adjuvant platinum-based chemotherapy (per investigator
  assessment) due to:'
- "ECOG PS2, or ECOG PS 0/1 and aged \u226570 years with substantial comorbidities\
  \ or other contraindication(s) to platinum-based doublet chemotherapy."
- "* Estimated life expectancy of \u22653 months."
- "* Age \u226518 years."
- '* Patient has recovered from surgery-related complications.'
- '* Adequate haematological, renal and liver function.'
- '* Patient is able to comply with the trial protocol, in the investigator''s judgment.'
- '* Negative pregnancy test Female participants of childbearing potential (including
  women who had their last menstruation in the last 2 years), must have a negative
  serum pregnancy test within 5 weeks before randomisation. Pregnancy test must be
  repeated within 3 days before the first dose of protocol treatment and at every
  treatment visit (urine beta HCG test is sufficient).'
- '* Use of highly effective contraceptive methods Female participants of childbearing
  potential (including women who had their last menstruation in the last 2 years)
  and male participants with a female partners of childbearing potential must agree
  to use a highly effective method of contraception for the duration of the protocol
  treatment and until 4 months after the last dose of cemiplimab.'
- '* Written Informed Consent must be signed and dated by the patient and the investigator
  prior to any trial-related intervention.'
- 'Exclude - Exclusion Criteria:'
- Exclude - * EGFR-mutant or ALK-rearranged NSCLC.
- Exclude - * Any small cell component
- Exclude - * Prior neoadjuvant and/or adjuvant systemic treatment for NSCLC.
- 'Exclude - Note: Previous treatment for another malignancy not excluded as per next
  criterion (Participating in another interventional clinical trial for NSCLC) is
  allowed if the below conditions are fulfilled:'
- Exclude - * Treatment with an approved systemic therapy is completed \>4 weeks before
  randomisation or
- Exclude - * Treatment with systemic biologic therapy is completed \>5 half-lives
  before randomisation and patient has recovered from any immune-mediated adverse
  events and endocrinopathies are adequately managed with hormone replacement.
- Exclude - * Participating in another interventional clinical trial for NSCLC.
- Exclude - * Diagnosis with another malignancy other than NSCLC that is progressing
  or requires active treatment.
- 'Exclude - Exceptions:'
- Exclude - * Non-melanoma skin cancer that has undergone potentially curative therapy
- Exclude - * In situ cervical carcinoma
- Exclude - * Any tumour that has been deemed to be definitively treated, such as
  definitively treated non-metastatic prostate cancer.
- Exclude - * Has any condition requiring ongoing/continuous corticosteroid therapy
  (\>10 mg prednisone/day or anti-inflammatory equivalent) within 1 week prior to
  randomisation. Physiologic replacement doses are allowed even if they are \>10 mg
  of prednisone per day or equivalent, as long as they are not being administered
  for immunosuppressive intent. Inhaled or topical steroids are permitted, provided
  that they are not for treatment of an autoimmune disorder.
- 'Exclude - Note: Patients who require a brief course of steroids (ex. 3 days in
  the week before randomisation) or physiologic replacement are allowed to be included
  in the study.'
- Exclude - * Ongoing or recent (within 5 years) evidence of significant autoimmune
  disease that required treatment with systemic immunosuppressive treatments.
- 'Exclude - The following are not exclusions: vitiligo, childhood asthma that has
  resolved, endocrinopathies (such as hypothyroidism or type 1 diabetes) that require
  only hormone replacement, or psoriasis that does not require systemic treatment.'
- Exclude - * Encephalitis, meningitis, organic brain disease (e.g., Parkinson's disease)
  or uncontrolled seizures within 1 year prior to randomisation.
- Exclude - * Myocardial infarction within 6 months prior to randomisation.
- Exclude - * Known history of, or any evidence of, interstitial lung disease or active,
  non-infectious pneumonitis within 5 years prior to randomisation.
- Exclude - * Uncontrolled infection with HIV, hepatitis B, or hepatitis C infection;
  or the patient has a diagnosis of immunodeficiency.
- Exclude - * Patients with known HIV infection who have controlled infection \[undetectable
  viral load (HIV RNA PCR) and CD4 count above 350 either spontaneously or on a stable
  antiviral regimen\] are allowed to be included in the study. Patients with controlled
  HIV infection should be monitored according to local standards.
- Exclude - * Patients with hepatitis B (HBsAg+) with controlled infection (serum
  hepatitis B virus DNA PCR that is below the limit of detection and receiving antiviral
  therapy for hepatitis B) may be included in the study. Patients with controlled
  infection must undergo regular monitoring of HBV DNA. Patients must remain on antiviral
  therapy for at least 6 months after the last dose of cemiplimab.
- Exclude - * Patients who are hepatitis C virus antibody positive (HCV Ab+) with
  controlled infection (undetectable HCV RNA by PCR either spontaneously or in response
  to a successful prior course of anti-HCV therapy) may be included in the study.
- Exclude - * Any infection requiring hospitalisation or treatment with intravenous
  anti-infectives within 2 weeks before randomisation.
- Exclude - * Receipt of a live vaccine within 28 days before randomisation.
- Exclude - * Receipt of a COVID-19 vaccination within 1 week before randomisation.
- Exclude - * Prior allogeneic stem cell transplantation or received organ transplants
  at any time, or autologous stem cell transplantation within 12 weeks before randomisation.
- Exclude - * Known or suspected hypersensitivity to cemiplimab or its excipients.
- Exclude - * Women who are pregnant, planning to become pregnant or are in the period
  of lactation.
- Exclude - * Sexually active men and women of childbearing potential who are not
  willing to use an effective contraceptive method during the study.
- Exclude - * Patients who are, or have an immediate family member who is, a member
  of the clinical study team, unless prior approval has been obtained from the sponsor
  (ETOP IBCSG Partners Foundation).
- Exclude - * Judgement by the investigator that the patient is unlikely to comply
  with study procedures, restrictions and requirements.
short_title: A Clinical Study to Assess the Efficacy of Adjuvant Immunotherapy With
  Cemiplimab in Patients With Surgically Removed Non-small Cell Lung Cancer Who Have
  Not Received Prior Chemotherapy
