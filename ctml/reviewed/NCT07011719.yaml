status: open to accrual
summary: The purpose of the study is to evaluate the progression-free survival (PFS)
  of casdatifan versus placebo when each is given in combination with cabozantinib
  in adult patients with confirmed advanced or metastatic clear cell Renal Cell Carcinoma
  who have experienced progression on or after prior anti-PD-1 or anti-PD-L1 immunotherapy.
