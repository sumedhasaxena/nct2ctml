prior_treatment_requirements:
- 'Inclusion Criteria:'
- "* Chemotherapy-naive participants, planned to receive AC or cisplatin-based chemotherapy\
  \ greater than or equal to (\u2265)70 milligrams per square meter (mg/m\xB2), on\
  \ Day 1 of each cycle, with no multiple administrations during the CINV observation\
  \ period, from Day 2 to Day 5 of each cycle."
- '* Have an Eastern Cooperative Oncology Group (ECOG) performance status of 0 to
  2.'
- 'Exclude - Exclusion Criteria:'
- Exclude - * Have symptomatic or untreated central nervous system (CNS) metastases.
- Exclude - * Have an established diagnosis of uncontrolled diabetes mellitus.
- Exclude - * Have a history of, or current evidence of, a clinically significant
  cardiac condition or QT/QTcF-related conditions.
- Exclude - * Have another etiology for nausea and vomiting, or receives medications
  with know or potential antiemetic activity
- Exclude - * Signs, symptoms or history of thyroid tumors
- Exclude - * Receives treatment with a gastric inhibitory polypetide (GIP) or glucagon-like
  peptide-1 (GLP-1) receptor agonist within 4 weeks prior to chemotherapy.
- Exclude - * Have participated in a clinical study involving study intervention within
  30 days of Cycle 1 Day 1 (C1D1). If the previous study intervention has a long half-life,
  within 3 months or 5 halflives, whichever is longer, of C1D1.
- Exclude - * Are pregnant, breastfeeding, or intend to become pregnant during the
  study or within 30 days of the last dose of study intervention.
short_title: A Study to Evaluate LY3537021 for the Treatment of Nausea and Vomiting
