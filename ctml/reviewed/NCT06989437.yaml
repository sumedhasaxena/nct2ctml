prior_treatment_requirements:
- 'Key inclusion Criteria:'
- '* Signed Informed Consent Document'
- '* Documented active diagnosis of metastatic pancreatic ductal adenocarcinoma'
- '* Cachexia defined by Fearon criteria of weight loss'
- '* Completed 1 x 28-day cycle of first-line systemic nab-paclitaxel and gemcitabine
  chemotherapy or 2 x 14-day cycles of FOLFIRINOX chemotherapy and prior to receiving
  Cycle 2 chemotherapy'
- "* ECOG PS \u22641 with life expectancy of at least 4 months"
- 'Exclude - Key Exclusion Criteria:'
- Exclude - * Current active reversible causes of decreased food intake
- Exclude - * Cachexia caused by other reasons
- Exclude - * History of heart failure
- Exclude - * Left ventricular ejection fraction \<50%
- Exclude - * Receiving tube feedings or parenteral nutrition at the time of Screening
  or Randomization
- Exclude - * History of allergic or anaphylactic reaction to any therapeutic or diagnostic
  monoclonal antibody
- Exclude - * History of allergy or hypersensitivity to any of the chemotherapeutics
  or any of their excipients
- Exclude - * Neuroendocrine (carcinoid, islet cell) or acinar pancreatic carcinoma,
  symptomatic brain metastasis, leptomeningeal disease or other active CNS metastases
- Exclude - * Inadequate liver function
- Exclude - * Renal disease requiring dialysis or eGFR \<30 mL/min/1.73m2
short_title: A Study to Learn About the Medicine Ponsegromab in Adults With Cancer
  of the Pancreas Which Has Spread and Caused Significant Body Weight Loss and Fatigue
