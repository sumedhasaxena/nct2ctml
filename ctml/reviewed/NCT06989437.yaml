summary: Study to investigate the efficacy, safety and tolerability of systemic chemotherapy
  plus ponsegromab versus systemic chemotherapy plus placebo for the first-line treatment
  in adult participants with cachexia and metastatic pancreatic ductal adenocardinoma.
