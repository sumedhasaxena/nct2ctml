status: open to accrual
summary: This is a global, multicenter, open-label, randomized Phase 3 study comparing
  the efficacy and safety of RLY-2608 + fulvestrant to capivasertib + fulvestrant
  for the treatment of patients with HR+/HER2- ABC with PIK3CA mutation following
  recurrence or progression on or after treatment with a CDK4/6 inhibitor.
