prior_treatment_requirements:
- 'Inclusion Criteria:'
- '* Participant has provided informed consent before initiation of any study-specific
  activities/procedures.'
- "* Age \u2265 18 years (or \u2265 legal age within the country if it is older than\
  \ 18 years) at the time of signing the informed consent."
- '* Participant must have histological, pathological, and/or cytological confirmation
  of adenocarcinoma of the prostate. Mixed histologies (eg, adenocarcinoma with neuroendocrine
  component) are not permitted.'
- "* Metastatic castration-resistant prostate cancer (mCRPC) with \u2265 1 metastatic\
  \ lesion that is present on baseline computed tomography (CT), magnetic resonance\
  \ imaging (MRI), or bone scan imaging obtained within 28 days before enrollment."
- '* Evidence of progressive disease (PD), defined as 1 or more PCWG3-modified RECIST
  1.1 criteria:'
- '* Serum PSA progression is defined as 2 consecutive increases in PSA over a previous
  reference value measured at least 1 week prior. The minimum start value is 2.0 ng/mL.'
- "* Soft-tissue progression defined as an increase \u2265 20% in the sum of the diameter\
  \ (SOD) (short axis for nodal lesions and long axis for non-nodal lesions) of all\
  \ target lesions based on the smallest SOD since treatment started or the appearance\
  \ of 1 or more new lesions or unequivocal progression of existing non-target lesions."
- '* Progression of bone disease defined by the appearance of at least 2 new bone
  lesions(s) by bone scan (as per the 2+2 PCWG3-modified RECIST 1.1 criteria).'
- '* Participants must have had prior orchiectomy and/or ongoing androgen-deprivation
  therapy (ADT) and a castrate level of serum testosterone (\< 50 ng/dL or \< 1.7
  nmol/L).'
- '* Prior disease progression on 1, and only 1, androgen receptor pathway inhibitor
  (ARPI) (either enzalutamide, apalutamide, or darolutamide) is required.'
- "* Participants intended to receive cabazitaxel must have previously received \u2264\
  \ 6 cycles of docetaxel in the metastatic hormone-sensitive prostate cancer (mHSPC)\
  \ setting."
- '* Eastern Cooperative Oncology Group (ECOG) performance status (PS) of 0 or 1.'
- '* Adequate organ function.'
- 'Exclude - Exclusion Criteria:'
- 'Exclude - Disease Related:'
- Exclude - * Participants with a history of central nervous system (CNS) metastases.
- Exclude - * Unresolved toxicities from prior antitumor therapy not having resolved
  to CTCAE version 5.0 grade 1 or baseline, with the exception of alopecia or toxicities
  that are stable and well-controlled AND there is an agreement to allow inclusion
  by both the investigator and the sponsor.
- 'Exclude - Prior/Concomitant Therapy:'
- Exclude - * Prior six transmembrane epithelial antigen of the prostate 1 (STEAP1)-targeted
  therapy.
- Exclude - * Prior disease progression on or intolerance to abiraterone.
- Exclude - * Prior treatment with any chemotherapy regimen in the mCRPC setting and/or
  \> 6 cycles of docetaxel treatment in the mHSPC setting.
- Exclude - * Any anticancer therapy, immunotherapy, or investigational agent within
  4 weeks before first dose of study treatment, not including androgen suppression
  therapy (eg, luteinizing hormone-releasing hormone/gonadotropin releasing hormone
  \[LHRH/GnRH\] analogue \[agonist/antagonist\]).
- Exclude - * Prior Prostate-Specific Membrane Antigen (PSMA) radioligand therapy
  (RLT) within 3 months of first dose of study treatment. Participants who received
  \< 2 cycles of PSMA RLT within 6 weeks of first dose of study treatment are also
  excluded.
- Exclude - * Prior radionuclide therapy (radium-223) within 2 months of first dose
  of study treatment.
- Exclude - * Prior palliative radiotherapy within 2 weeks before first dose of study
  treatment. Participants must have recovered from all radiation-related toxicities.
- Exclude - * Concurrent cytotoxic chemotherapy, ARPI, immunotherapy, RLT, poly adenosine
  diphosphate ribose polymerase (PARP) inhibitor, biological therapy, investigational
  therapy.
- Exclude - * Treatment with live and live-attenuated vaccines within 4 weeks before
  the first dose of study treatment.
