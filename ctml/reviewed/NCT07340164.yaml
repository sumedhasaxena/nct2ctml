prior_treatment_requirements:
- 'Inclusion Criteria:'
- "* 1\\. Adults \u226518 years of age on the day of signing the Informed Consent\
  \ Form. Follow local regulatory requirements if the legal age of consent for trial\
  \ participation is \\>18 years old."
- 2\. Patient has signed the Informed Consent (ICF) and is able to comply with protocol
  requirements.
- 3\. Has HER2 expression per 2016 ASCO-CAP gastric cancer IHC scoring (3+/2+/1+)
  guidelines by local tests.
- '4\. Availability of tumor tissue for translational research: A formalin-fixed paraffin-embedded
  (FFPE) tumorblock (preferred) or at least 20 slides (unstained, freshly cut, serial
  sections) must be submitted.'
- 5\. Histologically confirmed high grade serous or high grade endometrioid ovarian,
  primary peritoneal, and/or fallopian tube cancer that is recurrent.
- 6\. Patient with an Eastern Cooperative Oncology Group (ECOG) performance status
  score of 0 or 1.
- '7\. Radiologically confirmed/documented disease progression while on PARP inhibitor
  therapy in either first or second-line maintenance setting Note: Documentation of
  disease progression must be within 180 days of last PARPi dose taken. Surgical salvage
  intervention and/or focal ablative therapies are allowed.'
- 1. Clinically benefited from PARPi maintenance prior to documented progression,
  as defined by at least 6 months of treatment duration with no progressive disease
  observed.
- '2. Progression on first-line maintenance PARP inhibitor: Participants are allowed
  maximum 1 additional line of platinum-based chemotherapy before study entry (note:
  treatment-free interval on platinum rechallenge must be \> 6 months, with documented
  disease progression prior to study entry.'
- '3. Progression on second-line maintenance PARP inhibitor: Participants are not
  allowed any additional systemic anticancer treatment before study entry.'
- "8\\. Patient with measurable disease according RECIST 1.1 criteria. 9. LVEF \u2265\
  50% within 28 days before randomization. 10. Patient has adequate organ function,\
  \ defined as follows:"
- "a) Absolute neutrophil count \u2265 1,500 cells/\u03BCL b) Platelets \u2265 100,000\
  \ cells/\u03BCL c) Hemoglobin \u2265 9 g/dL or \u2265 5.6 mmol/L d) Serum creatinine\
  \ \u2264 1.5\xD7 upper limit of normal (ULN) or calculated creatinine clearance\
  \ \u2265 50mL/min using the Cockcroft-Gault equation for patients with creatinine\
  \ levels \\> 1.5\xD7 institutional ULN e) Total bilirubin \u2264 1.5\xD7 ULN (\u2264\
  \ 2.0 x ULN in patients with known Gilbert's syndrome) or direct bilirubin \u2264\
  \ 1\xD7 ULN f) Aspartate aminotransferase (AST) and alanine aminotransferase (ALT)\
  \ \u2264 2.5\xD7 ULN unless liver metastases are present, in which case they must\
  \ be \u2264 5\xD7 ULN g) International normalized ratio or prothrombin time (PT)\
  \ \u22641.5\xD7 ULN and activated partial thromboplastin time \u22641.5\xD7 ULN.\
  \ Patients receiving anticoagulant therapy must have a PT or partial thromboplastin\
  \ within the therapeutic range of intended use of anticoagulants."
- '11\. Patient must have a negative serum pregnancy test within 72 hours of the first
  dose of study medication, unless they are of nonchildbearing potential. Nonchildbearing
  potential is defined as follows:'
- "1. Patient is \u2265 45 years of age and has not had menses for \\> 1 year."
- 2. A follicle-stimulating hormone value in the postmenopausal range upon screening
  evaluation if amenorrhoeic for \< 2 years without a hysterectomy and oophorectomy.
- '3. Post-hysterectomy, post-bilateral oophorectomy, or post-tubal ligation:'
- '* Documented hysterectomy or bilateral oophorectomy must be confirmed with medical
  records of the actual procedure or confirmed by an ultrasound, MRI, or CT scan.'
- '* Tubal ligation must be confirmed with medical records of the actual procedure.'
- "* Information must be captured appropriately within the site's source documents.\
  \ 12. Patient of childbearing potential must agree to use a highly effective method\
  \ of contraception with their partners starting from time of consent through 150\
  \ days after the last dose of study treatment. Note: Abstinence is acceptable if\
  \ this is the established and preferred contraception for the patient (Information\
  \ must be captured appropriately within the site's source documents) 13. Has proteinuria\
  \ \\<2+. If proteinuria is \u22652+, 24-hour urine must demonstrate \\<1 g of protein\
  \ in 24 hours."
- 'Exclude - Exclusion Criteria:'
- Exclude - \- 1. Primary platinum-refractory disease defined as disease progression
  during primary platinum-based chemotherapy or platinum-resistant disease defined
  as disease progression within 6 months of the last platinum administration in the
  second-line setting.
- Exclude - 2\. History of additional malignancy within 3 years before the date of
  enrolment. Exceptions are squamous and basal cell carcinomas of the skin and carcinoma
  in situ of the cervix, or malignancy that in the opinion of the Investigator, with
  concurrence of the Sponsor, is considered cured with minimal risk of recurrence
  within 3 years. 3. Patient has received prior anticancer therapy (chemotherapy,
  targeted therapies, hormonal therapy, radiotherapy) within 21 days or \< 5 times
  the half-life of the most recent therapy prior to Study Day 1, whichever is shorter.
- "Exclude - Note: The washout period for radiation therapy is as follows: \u2265\
  \ 4 weeks for palliative stereotactic radiation to chest and \u22652 weeks palliative\
  \ stereotactic radiation therapy to other anatomic areas."
- Exclude - 4\. Patient has known uncontrolled central nervous system metastases,
  carcinomatosis meningitis, or both.
- 'Exclude - Note: Patients with previously treated brain metastases may participate
  provided they are stable (without evidence of disease progression by imaging \[using
  the identical imaging modality for each assessment, either MRI or CT scan\] for
  at least 4 weeks prior to the first dose of study treatment and any neurologic symptoms
  have returned to baseline), have no evidence of new or enlarging brain metastases,
  and have not been using steroids for at least 7 days prior to study treatment. Carcinomatous
  meningitis precludes a patient from study participation regardless of clinical stability.
  5. Active and/or uncontrolled infection. The following exceptions apply:'
- "Exclude - 1. Participants with HIV infection are eligible if followings are met:\
  \ a. CD4+ T-cell count \u2265350 cells/mm3 at the time of screening, b. Virologic\
  \ suppression defined as confirmed HIV RNA level below 50 or the LLOQ (below the\
  \ limit of detection) at the time of screening and for at least 12 weeks before\
  \ screening, c. No AIDS-defining opportunistic infections or conditions within the\
  \ past 12 months, d. On stable ART regimen, without changes in drugs or dose modification,\
  \ for at least 4 weeks before trial entry (Day 1) and agree to continue ART throughout\
  \ the trial."
- "Exclude - 2. Participants with evidence of chronic HBV infection are eligible if\
  \ the followings are met: a. the HBV viral load is \\<2000 IU/mL b. start or maintain\
  \ antiviral treatment, if clinically indicated as per the investigator. c. they\
  \ have normal transaminase values, or, if liver metastases are present, abnormal\
  \ transaminases with a result of AST/ALT \\<3 \xD7 ULN, which are not attributable\
  \ to HBV infection."
- "Exclude - 3. Participants with a history of HCV infection are eligible if History\
  \ of hepatitis C infection eligible if the HCV viral load is below the level of\
  \ detection in the absence of antiviral therapy during the previous 4 weeks and\
  \ if they Have normal transaminase values, or, if liver metastases are present,\
  \ abnormal transaminases with a result of AST/ALT \\<3 \xD7 ULN, which are not attributable\
  \ to HCV infection."
- "Exclude - 6\\. Patient has not recovered (i.e., to Grade \u2264 1 or to baseline)\
  \ from cytotoxic therapy-induced adverse events(AEs)."
- "Exclude - Note: Patients with Grade \u2264 2 neuropathy, Grade \u2264 2 alopecia,\
  \ or Grade \u2264 2 fatigue are an exception to this criterion and may qualify for\
  \ the study."
- Exclude - 7\. Patient has not recovered adequately from AEs or complications from
  any major surgery prior to starting therapy.
- Exclude - 8\. Patient has a known hypersensitivity to the active substances or to
  any excipients of the study intervention 9. Evidence of active or ongoing bowel
  obstruction 10. Has a history of (non-infectious) interstitial lung disease (ILD)/pneumonitis
  that required corticosteroids, has current ILD/pneumonitis, or where suspected ILD/pneumonitis
  cannot be ruled out by imaging at screening.
- 'Exclude - 11\. Uncontrolled or significant cardiovascular disease, including the
  following:'
- Exclude - 1. QT interval corrected with Fridericia's formula interval \>470 ms (average
  of triplicate determinations).
- Exclude - 2. Diagnosed or suspected long QT syndrome or known family history of
  long QT syndrome.
- Exclude - 3. History of clinically relevant ventricular arrhythmias, such as ventricular
  tachycardia, ventricular fibrillation, or Torsade de Pointes.
- Exclude - 4. Myocardial infarction within 6 months prior to screening.
- Exclude - 5. Uncontrolled angina pectoris within 6 months prior to screening.
- Exclude - 6. New York Heart Association Class 2 to 4 congestive heart failure.
- "Exclude - 7. Patients with uncontrolled hypertension (defined as systolic blood\
  \ pressure \u2265 160 mmHg and/or diastolic blood pressure \u2265100 mmHg) based\
  \ on an average of \u2265 3 BP readings on \u2265 2 sessions."
- Exclude - 8. Complete left or right bundle branch block.
- Exclude - 9. Patients with troponin levels above ULN at screening (as defined by
  the manufaccturer), and wit any MI related symptoms. (For patients with elevated
  troponin levels but no MI symptoms, a cardiology consultation during the screening
  period is recommended..
- Exclude - 12\. Patient is currently participating and receiving study treatment
  or has participated in a study of an investigational agent and received study treatment
  or used an investigational device within 4 weeks of the first dose of treatment.
- Exclude - 13\. Patients with evidence of bleeding diathesis or significant coagulopathy
  (in the absence of therapeutic anticoagulation) 14. Patients with current abdominal/
  pelvic fistula. 15. Patient is considered a poor medical condition due to a serious,
  uncontrolled medical disorder, nonmalignant systemic disease, or active infection
  requiring systemic therapy. Specific examples include, but are not limited to, active,
  non-infectious pneumonitis; uncontrolled ventricular arrhythmia; uncontrolled major
  seizure disorder; unstable spinal cord compression; superior vena cava syndrome;
  or any psychiatric or substance abuse disorders that would interfere with cooperation
  with the requirements of the study(including obtaining informed consent).
- Exclude - 16\. Prior exposure to other HER2-targeted agents or antibody-drug conjugate
  that consists of an exatecan derivative that is a topoisomerase I inhibitor 17.
  Patient is pregnant or breastfeeding or is expecting to conceive children within
  the projected duration of the study, starting with the screening visit through 7
  months after the last dose of study treatment, or lactating woman.
- Exclude - 18\. Live vaccines within 30 days of first dose of study intervention
  and while receiving study intervention. Administration of inactivated vaccines (i.e.
  inactivated influenza vaccine) is permitted. Inactivated RNA or nonreplicating viral
  vector-based SARS-CoV-2 vaccines are allowed, as approved by local/regional Health
  Authorities. Novel live attenuated SARS-CoV-2 vaccines are not permitted.
