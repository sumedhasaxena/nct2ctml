status: open to accrual
summary: The purpose of this study is to investigate the efficacy and safety of fixed-duration
  sonrotoclax (also known as BGB-11417) plus zanubrutinib (also known as BGB-3111)
  (SZ) compared with fixed-duration of venetoclax plus acalabrutinib (AV) in participants
  with previously untreated chronic lymphocytic leukemia (CLL).
