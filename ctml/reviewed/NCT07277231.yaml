prior_treatment_requirements:
- 'Inclusion Criteria:'
- "* Treatment-na\xEFve (TN) adults with confirmed diagnosis of CLL which requires\
  \ treatment"
- '* Eastern Cooperative Oncology Group (ECOG) score 0, 1, or 2'
- '* Measurable disease by Computer Tomography/Magnetic Resonance Imaging'
- '* Adequate bone marrow and organ function'
- 'Exclude - Exclusion Criteria:'
- Exclude - * Previous systemic treatment for CLL
- Exclude - * Known prolymphocytic leukemia or history of, or currently suspected,
  Richter's transformation
- Exclude - * Known central nervous system involvement
- Exclude - * History of confirmed progressive multifocal leukoencephalopathy (PML)
- Exclude - * Uncontrolled hypertension or clinically significant cardiovascular disease
- 'Exclude - Note: Other protocol defined Inclusion/Exclusion criteria may apply.'
short_title: A Study to Investigate Sonrotoclax (BGB-11417) Plus Zanubrutinib (BGB-3111)
  Compared With Venetoclax Plus Acalabrutinib in Adults With Previously Untreated
  Chronic Lymphocytic Leukemia
