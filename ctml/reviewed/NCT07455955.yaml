prior_treatment_requirements:
- 'Inclusion Criteria:'
- '* Chinese patient, female \>/=18 and \< 75 years of age.'
- '* Patient is diagnosed with early breast cancer.'
- "* Patient is na\xEFve to emetogenic chemotherapy moderately or highly emetogenicity."
- '* Patient is scheduled to receive her first course of neoadjuvant/adjuvant chemotherapy
  for breast cancer follows: AC: Intravenous (IV) Adriamycin 60 mg/m\^2 + Cyclophosphamide
  600 mg/m\^2, given as 14-day cycle or 21-day cycle, or FEC: IV Fluorouracil 500
  mg/m\^2 + Epirubicin 50 mg/m\^2 + Cyclophosphamide 500 mg/m\^2, given as 21-day
  cycle'
- '* Patient has a predicted life expectancy of 4 months.'
- '* Patient has ECOG (Eastern Cooperative Oncology Group) Performance Status of 0-1.'
- '* Premenopausal female patients must not be pregnant (documented negative urine
  pregnancy test).'
- '* Patient is able to read, understand and complete study questionnaires and diary,
  including questions requiring a visual analog scale (VAS) response.'
- '* Patient understands the procedures and agrees to participate in the study by
  giving written informed consent.'
- 'Exclude - Exclusion Criteria:'
- Exclude - * Patient with advanced breast cancer.
- Exclude - * Patient receiving cisplatin or any other chemotherapy of higher emetogenic
  potential, except for cyclophosphamide and doxorubicin in the regimens described
  above.
- Exclude - * Patients who are scheduled to receive concurrent radiation as part of
  their chemotherapy regimen for their malignancy
- Exclude - * Patients who experience any vomiting or grade 2-3 nausea per Common
  Terminology Criteria for Adverse Events version 4.0 (CTCAE v 4.03) in the 24 hours
  before Day 1 of chemotherapy
- Exclude - * Patient has a history of treatment with moderately to highly emetogenic
  chemotherapy.
- Exclude - * Patient has an active infection (e.g., pneumonia, systemic fungal infection)
  or any uncontrolled disease (e.g., diabetes mellitus, hypertension) which, in the
  opinion of the investigator, might confound the results of the study or pose unwarranted
  risk.
- Exclude - * Patient with history of glaucoma, dementia, seizures, Parkinson's disease,
  Neuroleptic Malignant Syndrome (NMS), thromboembolic events.
- Exclude - * Patient currently uses any illicit drugs, including marijuana, or has
  current evidence of alcohol abuse as determined by the investigator.
- Exclude - * Patient is mentally incapacitated or has a significant emotional or
  psychiatric disorder that, in the opinion of the investigator, precludes study entry.
- Exclude - * Patients who are regular alcohol drinker or smoker
- Exclude - * Patient has a history of any illness that, in the opinion of the investigator,
  might confound the results of the study or pose unwarranted risk.
- Exclude - * Patient has a history of hypersensitivity to aprepitant, ondansetron
  or dexamethasone.
- Exclude - * Patients who have phenylketonuria and abnormal uric acid.
- Exclude - * Any investigational drugs taken within 4 weeks prior to Day 1 of cycle
  1, and/or is scheduled to receive any investigational drug during the study.
