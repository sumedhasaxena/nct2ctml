status: open to accrual
summary: 'The objectives of this study are to determine if pharmacogenetic (PG) analysis
  of an individual enable optimal selection of antiemetic regimen for patients undergoing
  the first cycle of AC (Adriamycin + Cyclophosphamide) or FEC (Fluorouracil + Epirubicin
  + Cyclophosphamide) chemotherapy. It also aims to compare the quality of life of
  patients in the first cycle of AC / FEC chemotherapy with and without PG analysis.


  Patients will be randomized to undergo PG analysis \[PG group\] versus no PG analysis
  \[Non-/+PG group\]. Those in the PG group would be offered currently available optimal
  antiemetic prophylaxis, with or without Olanzapine according to PG outcomes. Those
  in the Non-PG group would be offered currently available optimal antiemetic prophylaxis.'
