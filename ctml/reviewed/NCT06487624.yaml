status: open to accrual
summary: The purpose of this study is to find out whether IV injection of HCB301 is
  an effective treatment for different types of advanced solid tumors and relapsed
  and refractory classical Hodgkin lymphomas and what side effects (unwanted effects)
  may occur in subjects aged 18 years old and above.
