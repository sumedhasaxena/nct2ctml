prior_treatment_requirements:
- 'Inclusion Criteria:'
- 1. Able to understand and be willing to sign the ICF.
- "2. Male and female subjects of \u226518 years of age."
- '3. Histologically/cytologically confirmed, locally advanced solid tumor:'
- subjects confirmed advanced solid tumors who have relapsed or refractory and should
  have no options for standard or approved therapies known to potentially confer clinical
  benefit or classical Hodgkin lymphoma, relapsed or refractory to at least 2 prior
  lines of systemic therapy.
- 4. For subjects with advanced solid tumors - must have at least 1 measurable lesion
  as defined by Response Evaluation Criteria in Solid Tumors (RECIST) v1.1 at baseline.
- 5. For subjects with classical Hodgkin lymphoma - must have classical Hodgkin lymphoma
  that is measurable or assessable for response.
- 6. Must have ECOG performance status of 0 to 1 at Screening.
- 7. Able to provide tumor tissue samples.
- "8. Have a life expectancy of \u226512 weeks."
- 'Exclude - Exclusion Criteria:'
- Exclude - 1. With known history of hypersensitivity to any components of HCB301.
- Exclude - 2. Known active or untreated CNS metastases and/or carcinomatous meningitis.
- Exclude - 3. Have undergone a major surgery or radical radiotherapy within 28 days
  or palliative radiotherapy within 14 days or have used a radioactive drug within
  56 days prior to the first dose of HCB301.
- Exclude - 4. Clinically significant cardiovascular condition.
- "Exclude - 5. Any previous treatment-related toxicities which have not recovered\
  \ to \u2264 Grade 1 as evaluated by National Cancer Institute, Common Terminology\
  \ Criteria for Adverse Events (NCI CTCAE) version 5.0 or baseline, except alopecia\
  \ and anemia."
- Exclude - 6. With known inherited or acquired bleeding disorder or bleeding diathesis.
  .
- Exclude - 7. Have RBC transfusion within 4 weeks prior to Screening.
- Exclude - 8. With a previously documented diagnosis of hemolytic anemia or Evans
  Syndrome in the last 3 months.
- Exclude - 9. Any investigational or approved systemic cancer therapy administered
  within 21 days or 5 half-lives, whichever is shorter, before the first dose of the
  study drug.
- "Exclude - 10. Active use of vitamin K antagonist anticoagulant like warfarin. Use\
  \ of low molecular weight heparin and factor Xa inhibitors will be permitted on\
  \ case by case basis. There will be no restriction for daily aspirin \u2264 100\
  \ mg/QD."
- Exclude - 11. Have used herbal medication within 14 days prior to the first dose
  of HCB301.
- "Exclude - 12. Have received any treatment targeting the SIRP\u03B1-CD47, PD-L1,\
  \ or TGF-\u03B2 pathway."
- Exclude - 13. Have other malignancies requiring treatment within 2 years prior to
  the first dose of HCB301.
- Exclude - 14. An investigational device used within 28 days prior to the first dose
  of HCB301.
- Exclude - 15. Positive for hepatitis B, active hepatitis C infections, positive
  for HIV, or known active or latent tuberculosis.
- Exclude - 16. Known to have a history of alcoholism or drug abuse.
short_title: "An Engineered Sirp\u03B1 Fused to Anti-Pd-L1 And Tgf-\u03B2 Fusion Protein\
  \ (HCB301) in Subjects With Selected Advanced Tumors"
