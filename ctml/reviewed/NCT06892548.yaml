status: open to accrual
summary: This study aims to investigate the combination of BNT324, a B7-H3 antibody-drug
  conjugate (ADC) with BNT327, a programmed death-ligand 1 (PD-L1) and vascular endothelial
  growth factor (VEGF) bispecific antibody, in participants with advanced/metastatic
  or relapsed/progressive small cell lung cancer (SCLC) and non small cell lung cancer
  (NSCLC).
