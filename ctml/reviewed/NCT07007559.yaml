prior_treatment_requirements:
- 'Inclusion Criteria:'
- '* Histologically confirmed invasive HER2+ breast cancer.'
- '* Received at least one prior line of therapy including T-DXd (ENHERTU) for locally
  advanced/metastatic HER2+ breast cancer. Prior neoadjuvant therapy which resulted
  in relapse within 6 months of completion of T-DXd will be considered a line of treatment
  for metastatic disease. Participants who discontinue T-DXd due to intolerance are
  considered eligible.'
- '* Progressed on or following the most recent line of therapy.'
- '* Eligible to receive one of the following chemotherapy options (capecitabine,
  eribulin, gemcitabine, paclitaxel or vinorelbine).'
- '* Measurable disease as defined by RECIST v1.1.'
- "* LVEF \u226550%."
- '* Eastern Cooperative Oncology Group (ECOG) Performance Status (PS) must be 0 to
  1.'
- '* Life expectancy of at least 3 months.'
- "* Adequate renal function (estimated creatinine clearance \u226530 mL/min as calculated\
  \ using the Cockcroft-Gault equation or Chronic Kidney Disease Epidemiology Collaboration\
  \ (CKD-EPI) equation."
- '* Adequate liver function:'
- "* Total bilirubin \u22641.5 x upper limit of normal (ULN) (\u22643.0 x ULN if the\
  \ participant has documented Gilbert syndrome);"
- "* Aspartate and alanine transaminase (AST and ALT) \u22643 x ULN (\u22645.0 x ULN\
  \ if liver involved by metastatic disease)."
- "* Participants must have recovered from all AEs due to previous therapies, procedures,\
  \ and surgeries to baseline severity or \u2264Grade 1 per NCI CTCAE v5.0 except\
  \ for AEs not deemed reversible and which do not constitute a safety risk by Investigator\
  \ judgment."
- 'Exclude - Exclusion Criteria:'
- Exclude - * Participants with known CNS metastases unless treated and stable prior
  to enrollment.
- "Exclude - * Prior exposure to any anti-CD47 or anti-SIRP\u03B1 agent."
- Exclude - * Any condition that would be contraindicated to receiving trastuzumab
- Exclude - * Has a diagnosis of complete dihydropyrimidine dehydrogenase (DPD) deficiency
  or significant toxicity with prior flurouracil (5FU) based regimen
- 'Exclude - * Following anti-cancer therapy with insufficient washout before start
  of treatment:'
- Exclude - 1. chemotherapy, hormonal therapy, radiation therapy or small molecule
  anti-cancer therapy within 14 days or 5 half-lives (whichever is shorter) of start
  of treatment.
- 'Exclude - 2. Immune therapy or other biologic therapy (e.g., monoclonal antibodies,
  antibody-drug conjugates) for the treatment of cancer for: 28 days or 5 half-lives
  (whichever is shorter) of start of treatment).'
- Exclude - * History of autoimmune hemolytic anemia, autoimmune thrombocytopenia,
  or hemolytic transfusion reaction.
- Exclude - * Had an allogeneic tissue/solid organ transplant.
- Exclude - * Any active, unstable cardiovascular disease.
- Exclude - * Intolerance to or who have had a severe allergic or anaphylactic reaction
  to antibodies or infused therapeutic proteins or participants who have had a severe
  allergic or anaphylactic reaction to any of the substances included in the study
  drug (including excipients).
- Exclude - * Has an active autoimmune disease that has required systemic treatment
  in past 2 years.
- Exclude - * Other primary malignancy within 2 years.
