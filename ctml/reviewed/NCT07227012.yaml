status: open to accrual
summary: 'The purpose of this study is to learn about the effects of study medicine
  (PF-08634404) when given alone or with another antibody (ipilimumab) for the treatment
  of a type of liver cancer called hepatocellular carcinoma (HCC) that is either locally
  advanced (spread to nearby tissues) or has spread to other parts of the body.


  To join the study, participants must meet the following conditions:


  * Be 18 years or older.

  * Have locally advanced or metastatic HCC.

  * Is not a candidate for complete surgical or loco-regional therapies.

  * Have not received any whole-body treatment for HCC.


  Participants will receive PF-08634404 either alone or in combination with ipilimumab.
  The medicine will be given through intravenous (IV) infusions, which means it will
  be administered directly into a vein. All treatments will take place at clinical
  trial sites, where trained medical staff will monitor participants during and after
  each visit.'
