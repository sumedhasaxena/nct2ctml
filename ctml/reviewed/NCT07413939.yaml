  II/III Study of the Blood-brain Barrier Penetrant RO7771950 Versus Tucatinib, Both
  in Combination With Trastuzumab and Capecitabine, in Patients With Pretreated Unresectable
  Locally Advanced or Metastatic HER2-Postivie Breast Cancer, With or Without Central
