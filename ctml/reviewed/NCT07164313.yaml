prior_treatment_requirements:
- 'Inclusion Criteria:'
- '* Pathologically or cytologically confirmed diagnosis of HCC with evidence of locally
  advanced (unresectable, and ineligible for transplant) and/or metastatic disease.
  Noninvasive methods may be used to confirm diagnosis'
- '* Measurable disease per RECIST v1.1'
- '* Eastern Cooperative Oncology Group (ECOG) Performance Status score of 0 or 1'
- '* Liver function status of Child-Pugh Class A'
- '* Adequate organ function'
- 'Exclude - Exclusion Criteria:'
- Exclude - * Known additional malignancy that is progressing or that has required
  active treatment within the last year
- Exclude - * History of hepatic encephalopathy within the past 6 months or requirement
  for medications to control encephalopathy
- Exclude - * Portal vein thrombosis within 3 months prior to Cycle 1 Day 1 that require
  coagulation therapy or is not stable
- Exclude - * Known gastrointestinal bleeding within 3 months
- Exclude - * Acute or chronic uncontrolled renal disease, pancreatitis, or non-malignant
  liver disease
