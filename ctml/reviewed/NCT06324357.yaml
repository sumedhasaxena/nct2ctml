  Randomized, Open-label, Multicenter Trial of Oral Zongertinib (BI 1810631) Alone
  or in Combination With Other Agents for the Treatment of Patients With Advanced
  HER2+ Metastatic Breast Cancer (mBC), Metastatic Gastric, Gastroesophageal Junction,
  or Esophageal Adenocarcinoma (mGEAC), or Metastatic Colorectal Cancer (mCRC)'
