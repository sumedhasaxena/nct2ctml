prior_treatment_requirements:
- 'Inclusion Criteria:'
- "1. Age \u2265 18 years (or \\> legal age within the country if it is older than\
  \ 18 years)."
- 2. Pathologically documented, locally-advanced or metastatic malignancy with any
  missense mutation in the KRAS gene or evidence of KRAS amplification using an analytically
  validated KRASWT amplification assay.
- 3. Participants must have no standard of care treatment options or have actively
  refused such therapy.
- 4. Able to swallow and retain per oral administered study treatment.
- 5. Eastern Cooperative Oncology Group (ECOG) Performance Status of 0 or 1.
- 6. Disease measurable as defined by Response Evaluation Criteria in Solid Tumors
  Version 1.1 (RECIST v1.1), as determined by the site investigator.
- 7. Adequate organ function.
- 8. Archival (formalin-fixed, paraffin-embedded \[FFPE\]) tumor tissue or block collected
  within 5 years before screening must be available. Participants without archived
  tumor tissue may undergo tumor biopsy before AMG 410 dosing (Day1).
- 'Exclude - Exclusion Criteria:'
- Exclude - 1. Untreated symptomatic central nervous system or leptomeningeal metastases.
- Exclude - 2. Uncontrolled pleural effusion and/or ascites.
- Exclude - 3. History of other malignancy within the past 5 years.
- Exclude - 4. Active systemic infection or symptoms that indicate an acute and/or
  uncontrolled infection requiring IV antibiotics within 7days prior to the first
  dose of study treatment.
- Exclude - 5. History of arterial or venous thrombosis (eg, stroke, transient ischemic
  attack, pulmonary embolism, or deep vein thrombosis).
- Exclude - 6. Live and live-attenuated vaccines are prohibited within 28 days prior
  to the first dose of study treatment.
- Exclude - 7. History of solid organ transplant.
- Exclude - 8. Anti-tumor therapy (chemotherapy, antibody therapy, molecular targeted
  therapy, hormonal therapy, or investigational agent) within 28 days of first dose
  of study treatment.
- 'Exclude - 9. Presence or history of any of the following viral infections: HIV,
  Hepatitis C, Hepatitis B, and active severe acute respiratory syndrome coronavirus
  2 (SARS-CoV-2).'
- Exclude - 10. Toxicities from prior anti-tumor therapy (including radiotherapy)
  not having improved to at least Common Terminology Criteria for Adverse Events (CTCAE)
  version 5.0 grade 1.
- Exclude - 11. Therapeutic or palliative radiation therapy within 2 weeks of first
  dose of study treatment.
- Exclude - 12. Major surgery within 28 days of first dose of study treatment.
- Exclude - 13. History or evidence of any other clinically significant disorder,
  condition, or disease that, in the opinion of the investigator, would pose a risk
  to participant safety.
