status: open to accrual
summary: 'Researchers want to know if V940 (the study treatment) given with pembrolizumab
  and chemotherapy can treat metastatic treatment-naive squamous non-small cell lung
  cancer (NSCLC). V940 is designed to help a person''s immune system attack their
  specific cancer.


  The goal of this study is to learn if people who receive V940 with pembrolizumab
  and chemotherapy live longer overall and without the cancer growing or spreading
  compared to people who receive placebo with pembrolizumab and chemotherapy. A placebo
  looks like the study treatment but has no study treatment in it. Using a placebo
  helps researchers better understand the effects of the study treatment.'
treatment_list:
  step:
  - step_internal_id: 111
    step_code: '1'
    step_type: Registration
    arm:
    - arm_code: V940 + Pembrolizumab + Chemo
      arm_internal_id: 0
      arm_description: "Induction phase: Participants receive pembrolizumab 400 mg\
        \ intravenous (IV) infusion on Day 1 of a six week cycle plus a platinum doublet\
        \ chemotherapy regimen (carboplatin area under the curve (AUC) 6 mg/mL/min\
        \ IV infusion every 3 weeks (Q3W) \xD7 2 doses combined with either paclitaxel\
        \ 200 mg/m\\^2 IV infusion Q3W \xD7 2 doses OR nab paclitaxel 100 mg/m\\^2\
        \ IV infusion weekly \xD7 6 doses). V940 1 mg intramuscular (IM) injection\
        \ is administered on Days 1 and 22 of Cycle 2 Induction (Q3W) for up to 2\
        \ doses.\n\nMaintenance phase: Participants receive pembrolizumab 400 mg IV\
        \ infusion on Day 1 every 6 weeks (Q6W) for up to 15 doses. V940 1 mg IM injection\
        \ is administered on Days 1 and 22 (Q3W) for up to 7 doses during maintenance."
