status: open to accrual
summary: A study to evaluate the efficacy and safety of triplet combination of inavolisib
  plus ribociclib and fulvestrant versus placebo plus ribociclib and fulvestrant in
  the first-line setting in participants with endocrine-therapy-resistant hormone
  receptor (HR)-positive (HR+), human epidermal growth factor receptor 2-negative
  (HER2-) advanced breast cancer (ABC) with chromosome 8p loss (chr8p loss) and without
  PIK3CA mutation.
