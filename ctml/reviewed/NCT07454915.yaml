summary: "The purpose of this Phase 2 study is to compare the effects of administering\
  \ the PVX4 combination device biologic product (pBI-4 DNA vaccine via electroporation-mediated\
  \ intramuscular delivery with the TriGrid\u2122 Delivery System) in patients with\
  \ biopsy-confirmed, human papilloma virus (HPV) 16-associated high grade cervical\
  \ intraepithelial neoplasia (CIN2/3) as compared to the administration of placebo."
